name: Beta Release

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only run the `publish-beta` job if the correct label has been added to the PR
    if: github.event.label.name == 'Beta Release'
    steps:
      - uses: actions/checkout@v7

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: NPM update
        run: npm install -g npm@11.10.1

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          PUBLIC_API_URL: https://svelte-stache.pages.dev/api

      - name: Changesets Publish
        id: changeset
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm changeset publish --tag beta
          pr-title: 🦋 Release package updates
          commit-message: Bump package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v9
        if: steps.changeset.outputs.published == 'true'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const publishedPackages = ${{ steps.changeset.outputs.publishedPackages }};

            if(publishedPackages.length === 0) {
              throw new Error('No packages published, did you forget to add a changeset?');
            }

            const version = publishedPackages[0].version;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 \`${version}\` published to npm as a beta release

            To install the beta version, run one of the following commands in your project directory:
            \`\`\`
            npm install svelte-stache@${version}
            pnpm add svelte-stache@${version}
            yarn add svelte-stache@${version}
            \`\`\`
            `
            })

      - name: Remove label
        uses: actions/github-script@v9
        if: always()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Beta Release'
            })
