name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  pull-requests: write
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check
        env:
          PUBLIC_API_URL: https://svelte-stache.pages.dev/api

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test:run
        env:
          PUBLIC_API_URL: http://localhost:5173/api

  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: [lint, check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Corepack enable
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        env:
          PUBLIC_API_URL: https://svelte-stache.pages.dev/api

      - name: Changesets Publish
        id: changesets
        uses: changesets/action@v1.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          publish: pnpm changeset publish
          title: 🦋 Release package updates
          commit: Bump package versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
